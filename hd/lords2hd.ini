; Lords of the Realm II HD settings. Delete ddraw.dll to go back to the stock game.

[Display]
; 0 = stock DirectDraw (the game switches the monitor to 640x480 as it always did)
Enabled=1
; smooth = interpolated, sharp = square pixels, none = 640x480 unscaled
Scale=smooth
; 1 = the whole monitor, 0 = a window WindowScale times 640x480
Fullscreen=1
WindowScale=2
; 1 = scale by whole numbers only (wider black borders, every pixel the same size)
IntegerScale=0
; 1 = use the monitor's width: the county map grows to fill it (other screens stay centred for now)
Wide=0
; cursor size in percent: 100 = the same share of the screen as in the original game
CursorScale=50

[Debug]
; log every file the game loads
LogLoads=0
; save each palette shown on screen to lords2hd_dump\ with the files loaded before it
DumpPalettes=0
; log presents per second and their cost every 5 seconds
Timing=0
