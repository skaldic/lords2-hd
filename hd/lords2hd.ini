; Lords of the Realm II HD settings. Delete ddraw.dll to go back to the stock game.

[Display]
; 0 = stock DirectDraw (the game switches the monitor to 640x480 as it always did)
Enabled=1
; smooth = interpolated, sharp = square pixels, none = 640x480 unscaled
Scale=smooth
; with Scale=smooth: catmullrom = sharp interpolation, bilinear = the softer look of earlier versions
Upscale=catmullrom
; 1 = the whole monitor, 0 = a window WindowScale times 640x480
Fullscreen=1
WindowScale=2
; 1 = scale by whole numbers only (wider black borders, every pixel the same size)
IntegerScale=0
; 1 = use the monitor's width: the map and battles show more, the paintings in lords2hd\wide fill it
Wide=0
; 1 = with Wide, battles zoom out to show four times the field; 0 = the wide view at normal size
BattleZoom=1
; 1 = show the full-screen paintings from lords2hd\screens at double detail
HDScreens=1
; 1 = draw the county map's ground from lords2hd\tiles at double detail
HDTiles=1
; 1 = sharpen the game's lettering
SharpText=1
; 1 = animate foam along the coast on the county map
ShoreWaves=1
; cursor size in percent: 100 = the same share of the screen as in the original game
CursorScale=50
; game frames a second. The original game runs as fast as the CPU allows (thousands of frames
; a second, one CPU core always busy); 120 looks the same and leaves the CPU mostly idle. 0 = no limit
FrameLimit=120
; 1 = each tutorial scroll is shown once only (remembered below in [Tutorial]); 0 = every time, as the original
TutorialOnce=1

[Debug]
; log every file the game loads
LogLoads=0
; save each palette shown on screen to lords2hd_dump\ with the files loaded before it
DumpPalettes=0
; log presents per second and their cost every 5 seconds
Timing=0
