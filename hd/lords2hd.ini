; Lords of the Realm II HD settings. Delete ddraw.dll to go back to the stock game.

[Patch]
; written by the 1.5.0 installer: an ini without it (from before 1.5.0) is replaced by these defaults
; once, and kept as lords2hd-before-1.5.0.ini; later updates keep your settings
IniVersion=1.5.0

[Display]
; 0 = stock DirectDraw (the game switches the monitor to 640x480 as it always did)
Enabled=1
; smooth = interpolated, sharp = square pixels, none = 640x480 unscaled
Scale=smooth
; with Scale=smooth: fsr = AMD FSR 1 (sharpest), catmullrom = sharp interpolation, bilinear = the
; softer look of earlier versions
Upscale=fsr
; gpu = the graphics card draws the picture (Direct3D 11), cpu = the processor does (after a restart)
Renderer=gpu
; 1 = a refresh with nothing new from the game shows the last picture again (a steady 60 on the counter)
RepeatFrames=1
; 0 = off, 1 = frames a second, 2 = detailed timings (Ctrl+F10 switches it in the game)
FpsCounter=0
; 1 = the whole monitor, 0 = a window WindowScale times 640x480
Fullscreen=1
WindowScale=2
; 1 = scale by whole numbers only (wider black borders, every pixel the same size)
IntegerScale=0
; 1 = use the monitor's width: the map and battles show more, the paintings in lords2hd\wide fill it
; 0 = the original 4:3 picture
Wide=1
; 1 = with Wide, battles zoom out to show four times the field; 0 = the wide view at normal size
BattleZoom=1
; with BattleZoom, the mouse wheel zooms the battlefield in (around the cursor) and back out:
; 1 = up to 2x, the game's normal size; 2 = up to 4x; 0 = off
; zoomed in, the screen's edges (and WASD) move across the whole field first, then scroll the battlefield
WheelZoom=1
; with BattleZoom, the mouse wheel on the county map shows it zoomed out (twice as wide and tall) and back
CountyZoom=1
; 1 = troops on the battle minimap get a dark outline (the black player's: black with a white outline)
MinimapPop=0
; 1 = the Town Center's picture follows the season (spring, summer, autumn, winter), with its new peasants; 0 = the original Town Center and peasants
Seasons=1
; 1 = show the full-screen paintings from lords2hd\screens at double detail
HDScreens=1
; 1 = play the videos with their upscaled frames from lords2hd\videohd (sound and timing unchanged)
HDVideos=1
; 1 = draw the county map's ground from lords2hd\tiles at double detail
HDTiles=1
; 1 = sharpen the game's lettering
SharpText=1
; 1 = animate foam along the coast on the county map
ShoreWaves=1
; cursor size in percent: 100 = the same share of the screen as in the original game
CursorScale=50
; game frames a second. The original game runs as fast as the CPU allows (thousands of frames
; a second, one CPU core always busy); 120 looks the same and leaves the CPU mostly idle. 0 = no limit
FrameLimit=120
; 1 = each tutorial scroll is shown once only (remembered below in [Tutorial]); 0 = every time, as the original
TutorialOnce=1
; 1 = W, A, S, D scroll the county map and the battlefield (like holding the mouse at the edge)
WASD=1
; 1 = the arrow keys scroll the county map and the battlefield too
ArrowKeys=1
; 1 = , and . jump through your counties and armies on the county map
CycleKeys=1
; 1 = while one of your armies is selected, a scroll beside the side panel shows its troops
ArmyPanel=1
; 1 = diplomatic letters start with a fresh text (anything you type is kept)
Letters=1
; 1 = the dialogue and unit voices restored by Lords2Resounded; 0 = the game's own
Resounded=1

[Game]
; 1 = after Mop-Up, units whose target falls go after the nearest enemy instead of standing idle
; (also applies to the computer's charges); chasing units pick the nearest enemy they can walk to
; (not one on a wall, across water or a level up) and give up on one they can't reach; only knights
; and macemen go a long way round for one (a walk up to 60), slower units take the enemy at hand; idle units
; on Mop-Up start chasing again; selecting units keeps their Mop-Up, and your move or attack order
; ends it so they obey. In multiplayer every player needs the same setting
MopUpFix=1
; 1 = battle units stop stepping back and forth: a unit whose way is blocked by a friend waits for it
; instead of turning back, your units don't keep swapping places, and units stop next to a taken
; destination instead of dancing round it; a unit next to a dying enemy fights the live one beside
; it instead of sidestepping. Multiplayer: same setting for all
JitterFix=1
; 1 = idle soldiers fight an enemy 3 cells away (knights 4, enemy archers 5), but never go more than 4
; cells from where they stood, let an enemy that keeps running go, and at most 2 go for the same enemy
; unless it is already fighting or right beside them (so a group can't be baited away), and only when
; they aren't outnumbered by the enemy there and coming up behind it (a few holding a gap stay in it); a
; formation standing next to stakes, stones, a hedge, water, a castle wall, the gate or the moat holds that
; line and fights only an enemy beside it, even after a fight; archers with no target of yours shoot the nearest enemy fighting one of their side first, and after a
; fight they stand and shoot instead of chasing the next enemy into melee; archers step
; back from soldiers charging them and keep shooting (not from soldiers behind stakes, a hedge or water, who
; can't walk up to them), and step out of a fight once one of their soldiers
; takes over; siege engines and units on walls stay put. Both sides. Multiplayer: same setting for all
EngageFix=1
; 1 = a group ordered round a forest, river or other obstacle keeps its shape instead of trailing in a
; single file along the edge: its first unit plans the route and the others follow it side by side,
; closing up only where the gap is narrow. Your groups are formed again only after your order or selection, not every
; few seconds as the original did (units walked off to new places unasked). Both sides. Multiplayer: same
; setting for all
GroupMoveFix=1
; the computer's tactics in field battles: 0 = Normal (the game's own), 1 = Hard (it picks attack or
; defence once instead of switching every few seconds, keeps its archers behind its soldiers shooting,
; stepping back from yours and walking up into range of its soldiers' fights, sends its nearest soldiers to help archers you reach, and moves its
; soldiers up and charges together; at a bridge you hold its soldiers wait on their bank while its archers
; shoot, then storm it together), 2 = Legendary (Hard,
; plus picked targets when it attacks, closing in under fire, beaten groups regrouping, archers shooting
; archers first, a weaker army attacking after a long wait, and unit counters for both sides: pikemen
; against knights, swordsmen against pikemen, maces against knights, knights and swordsmen against
; peasants, archers and maces). In sieges only one rule, on Hard and
; Legendary: its soldiers step out of burning oil and don't walk back in while it burns.
; Multiplayer: every player needs the same level
BattleAI=0
; 1 = a computer lord counts each castle it starts against its limit, instead of starting one in
; every county at once (the Bishop's royal castles everywhere). Multiplayer: same setting for all
CastleCapFix=1
; 1 = a wheat field lost after planting costs its share of the grain once (the original took it a
; second time until another wheat field was laid out). Multiplayer: same setting for all
WheatFix=1
; when another window is active: 0 = the game pauses (original), 1 = it keeps running,
; 2 = it keeps running in multiplayer games only, so switching windows doesn't stall the others
RunInBackground=2
; 1 = no army can enter or strengthen a besieged castle (the game's own rule, which computer
; lords' reinforcements slipped past). Multiplayer: same setting for all
SiegeGarrisonFix=1
; Jen With a B's Mods: 1 = the fixes and mods below, from Lords II Mod Manager by Jen With a B (jenwithab),
; work (each by its own switch) and get their own panel (F11, or Mods on the menu bar); 0 = the game as
; without them
JenMods=1
; (Jen With a B's Mods) 1 = with the food slider between all cattle and all grain, a food that runs out is
; made up from the other one as far as it lasts. The original gave the full ration's effect while
; the county ate only what was left of the short food (an exploit). Multiplayer: same for all
RationFix=1
; (Jen With a B's Mods) 1 = in a multiplayer game, messages stay up until you close them (the original
; closed most of them at once). Only changes what you see, so it works in multiplayer too
MpMessageFix=1
; (Jen With a B's Mods) 1 = droughts and storms destroy fields (the original); 0 = they don't
FieldDestruction=1
; (Jen With a B's Mods) 1 = armies in an enemy county destroy its fields (the original); 0 = they don't,
; and computer lords no longer raise the people of a threatened county without a castle
Pillaging=1
; (Jen With a B's Mods) blows a castle's inner and outer doors take before they give way in a siege
; (originals 5000 and 20000; 1 to 100000)
InnerDoor=5000
OuterDoor=20000
; (Jen With a B's Mods) work to reclaim one destroyed field, and the most a season puts into it
; (originals 800 and 200; 1 to 10000)
ReclaimWork=800
ReclaimPerSeason=200
; (Jen With a B's Mods) 0 = castles hold 150, 200, 200, 400 or 600 men by their kind (the original);
; 1 = every castle holds as many as an army may (1500). Computer lords still plan their
; garrisons by the original sizes
GarrisonLimits=0
; (Jen With a B's Mods) the map a siege on each kind of castle is fought on: Original (its own), or one of the
; game's skirmish castles: Wooden palisade: River Island; Motte and bailey: Wooden Palace; Norman keep: Leeds
; Castle, Expanded Keep; Stone castle: Curtain Wall, The Ell, Portchester; Royal castle: Chambers, Island Castle,
; Goodrich. From the next siege; needs the game's STNFIEL2.PL8
PalisadeDesign=Original
MotteDesign=Original
KeepDesign=Original
StoneCastleDesign=Original
RoyalCastleDesign=Original
; (Jen With a B's Mods) 1 = the game speed goes past 10 (the original's most): every speed past 10 runs as fast as the PC can;
; back to 10 when off again
UncappedSpeed=0
; (Jen With a B's Mods) the Black Death: 0 = the original, 1 = milder (takes about half as many people),
; 2 = off (it spares every county)
BlackDeath=0
; (Jen With a B's Mods) 0 = the original; 500 to 5000 = each county's births steered towards that population in the
; long run (Jen's Population Average)
PopulationTarget=0
; (Jen With a B's Mods) 1 = an industry's output in a season (wood, iron, stone) isn't capped at 999 (99,999,999)
UncappedResources=0
; (Jen With a B's Mods) 1 to 10 = a season's wood, iron and stone times this (the original 1); more than 1 turns
; UncappedResources on in the panel
ResourceMultiplier=1
; (Jen With a B's Mods) the most men in an army (the original 1500; 50 to 10000). Castle garrisons follow it
ArmySize=1500
; (Jen With a B's Mods) 1 = an army's icon shows two and three men from a fifth and two fifths of ArmySize
; (the original 300 and 600)
ScaledArmyIcons=0
; the mods above from FieldDestruction on work in single player games only
; the fixes above that change what happens in the game stay off in a multiplayer game
; (everyone plays the original rules) unless this is 1 for EVERY player
MultiplayerFixes=0

[Units]
; (Jen With a B's Mods: Unit stats and Unit costs) a unit's own value, single player games only; a key that isn't here
; is the game's own. Keys: the unit (Peasant, Archer, Swordsman, Maceman, Pikeman, Crossbowman, Knight) and the stat:
; MeleeStrength (1-100), RangedDefence (0-100), AutoCalcStrength (0-100, its strength in a battle worked out without
; being fought), and for archers and crossbowmen RangedStrength (0-1000), AttackRange (0-50 cells), AttackSpeed (25,
; 50 or 100: the time between shots); for all but peasants WoodCost and IronCost (0-10000, what the blacksmith uses
; to make one), SellPrice (1-10000, what the merchant pays) and BuyPrice (1-10000, what the merchant asks; without
; it the sell price plus the merchant's share; never below the sell price), e.g. KnightMeleeStrength=30

[Debug]
; log every file the game loads
LogLoads=0
; save each palette shown on screen to lords2hd_dump\ with the files loaded before it
DumpPalettes=0
; log presents per second and their cost every 5 seconds
Timing=0
; 1 = each multiplayer game gets a folder lords2hd-mp\<date and time>\ with the versions, settings,
; per-season checksums and copies of the logs: zip it and post it when a game goes wrong
MpLogs=1
